name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

# A newer push makes an older run's answer stale, so the older one stops.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    permissions:
      contents: read
    name: make test-e2e on kind
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # kind at a pinned version, built from its module, rather than whatever
      # "latest" points at on the day.
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          kind version

      - name: Run the end-to-end tests
        run: make test-e2e
