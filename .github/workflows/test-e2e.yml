name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

# A newer push makes an older run's answer stale, so the older one stops.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    permissions:
      contents: read
    name: make test-e2e on kind
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # kind at a pinned version, built from its module, rather than whatever
      # "latest" points at on the day.
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          kind version

      - name: Run the end-to-end tests
        run: make test-e2e
