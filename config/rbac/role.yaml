---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - sail.oiax.example.com
  resources:
  - courses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sail.oiax.example.com
  resources:
  - courses/finalizers
  verbs:
  - update
- apiGroups:
  - sail.oiax.example.com
  resources:
  - courses/status
  verbs:
  - get
  - patch
  - update
